name: multilane-cli
arch: "${GOARCH}"
platform: linux
version: "${VERSION}"
version_schema: semver
release: "1"
section: net
priority: optional
maintainer: "MultiLane contributors"
description: |
  MultiLane tunnel for Linux servers and routers.
  Joins olcRTC rooms (including bonded multi-room pools) with carrier failover and
  routes the machine through a tun, or serves a local SOCKS5/HTTP proxy.
vendor: MultiLane
homepage: https://github.com/huKM565/multilane
license: GPL-3.0-or-later
contents:
  - src: dist/linux-${GOARCH}/multilane-cli
    dst: /usr/bin/multilane-cli
    file_info:
      mode: 0755
  - src: packaging/multilane-cli.service
    dst: /lib/systemd/system/multilane-cli.service
    packager: deb
  - src: packaging/multilane-cli.service
    dst: /usr/lib/systemd/system/multilane-cli.service
    packager: rpm
  - src: packaging/multilane-cli.service
    dst: /usr/lib/systemd/system/multilane-cli.service
    packager: archlinux
  - src: packaging/multilane-cli.service
    dst: /usr/lib/systemd/system/multilane-cli.service
    packager: apk
  - src: packaging/openrc/multilane-cli
    dst: /etc/init.d/multilane-cli
    packager: apk
    file_info:
      mode: 0755
  - src: packaging/README.md
    dst: /usr/share/doc/multilane-cli/README.md
  - src: LICENSE
    dst: /usr/share/doc/multilane-cli/LICENSE
  - src: COPYRIGHT
    dst: /usr/share/doc/multilane-cli/COPYRIGHT
scripts:
  preinstall: packaging/scripts/preinstall.sh
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
