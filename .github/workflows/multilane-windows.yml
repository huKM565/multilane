name: Build MultiLane for Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: false
        default: '1.0.474'
        type: string
      attach_run_id:
        description: 'Existing run ID to attach to GitHub Release without rebuilding'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  attach-existing:
    if: ${{ inputs.attach_run_id != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact from run and attach to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${{ inputs.version || '1.0.474' }}"
          tag="v$version"
          mkdir -p dist
          gh run download "${{ inputs.attach_run_id }}" -n MultiLane-windows-amd64 -D dist
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "MultiLane $tag" --notes "MultiLane $tag"
          gh release upload "$tag" \
            "dist/MultiLane-$version-windows-amd64.exe" \
            "dist/MultiLane-$version-windows-amd64.msi" \
            "dist/MultiLane-$version-windows-amd64-portable.zip" \
            --clobber

  build-windows:
    if: ${{ inputs.attach_run_id == '' }}
    runs-on: windows-latest
    steps:
      - name: Keep source and resources byte-for-byte
        run: git config --global core.autocrlf false

      - name: Checkout MultiLane
        uses: actions/checkout@v7
        with:
          path: multilane

      - name: Checkout pinned olcRTC
        uses: actions/checkout@v7
        with:
          repository: ghostlane-project/olcrtc
          ref: 2d4266af3947f4d9940efafb0d5aabb6207f6659
          path: olcrtc
          submodules: recursive

      - name: Apply MultiLane olcRTC occupancy patch
        shell: bash
        working-directory: olcrtc
        run: git apply ../multilane/scripts/patches/olcrtc-room-occupancy.patch

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: olcrtc/go.sum

      - name: Build sing-box
        shell: bash
        working-directory: multilane
        run: bash scripts/build-singbox.sh desktopApp/src/main/resources/native/sing-box.exe

      - name: Bundle Xray and verify native cores
        shell: pwsh
        working-directory: multilane
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "desktopApp/src/main/resources/native"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/v26.7.11/Xray-windows-64.zip" -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath xray-dist -Force
          $xray = Get-ChildItem xray-dist -Recurse -Filter "xray.exe" | Select-Object -First 1
          Copy-Item $xray.FullName "$dest/xray.exe"
          & "$dest/sing-box.exe" version | Select-Object -First 1
          & "$dest/xray.exe" version | Select-Object -First 1

      - name: Test and package Windows
        shell: pwsh
        working-directory: multilane
        env:
          OLCBOX_CRYPT_KEY_V1: ${{ secrets.OLCBOX_CRYPT_KEY_V1 }}
          OLCBOX_ADMIN_PASS_SHA256: ${{ secrets.OLCBOX_ADMIN_PASS_SHA256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ inputs.version || '1.0.474' }}"
          $env:OLCRTC_REPO = "${{ github.workspace }}\olcrtc"
          .\gradlew.bat "-Polcbox.version=$version" :sharedUI:jvmTest :desktopApp:packageReleaseExe :desktopApp:packageReleaseMsi :desktopApp:packageReleasePortableZip --stacktrace
          if ($LASTEXITCODE -ne 0) { throw "Gradle build failed" }

      - name: Prepare artifacts
        shell: pwsh
        working-directory: multilane
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ inputs.version || '1.0.474' }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem "desktopApp/build/compose/binaries/main-release/exe/*.exe" | Select-Object -First 1
          $msi = Get-ChildItem "desktopApp/build/compose/binaries/main-release/msi/*.msi" | Select-Object -First 1
          $zip = Get-ChildItem "desktopApp/build/compose/binaries/main-release/portable/*.zip" | Select-Object -First 1
          if ($null -eq $exe -or $null -eq $msi -or $null -eq $zip) { throw "A Windows package is missing" }
          Copy-Item $exe.FullName "dist/MultiLane-$version-windows-amd64.exe"
          Copy-Item $msi.FullName "dist/MultiLane-$version-windows-amd64.msi"
          Copy-Item $zip.FullName "dist/MultiLane-$version-windows-amd64-portable.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MultiLane-windows-amd64
          path: multilane/dist/MultiLane-*

      - name: Attach Windows packages directly to GitHub Release
        shell: pwsh
        working-directory: multilane
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ inputs.version || '1.0.474' }}"
          $tag = "v$version"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "MultiLane $tag" --notes "MultiLane $tag"
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }
          gh release upload $tag dist/MultiLane-$version-windows-amd64.exe dist/MultiLane-$version-windows-amd64.msi dist/MultiLane-$version-windows-amd64-portable.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
